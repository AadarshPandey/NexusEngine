services:
  nexus-application:
    build:
      context: ./NexusCore
      dockerfile: Dockerfile
      target: nexus-application
    image: nexuscore/nexus-application:latest
    container_name: nexus-application
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-nexus-media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - nexus-network

  nexus-frontend-web:
    build:
      context: ./NexusFrontendWeb
      dockerfile: Dockerfile
    image: nexuscore/nexus-frontend-web:latest
    container_name: nexus-frontend-web
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - nexus-application
    networks:
      - nexus-network

  nexus-admin-panel:
    build:
      context: ./NexusAdminPanel
      dockerfile: Dockerfile
    image: nexuscore/nexus-admin-panel:latest
    container_name: nexus-admin-panel
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nexus-application
    networks:
      - nexus-network

  # ─── Infrastructure Services ───────────────────────────

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexuscore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus-network

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  elasticsearch:
    image: elasticsearch:8.17.2
    container_name: elasticsearch
    restart: always
    environment:
      - "cluster.name=nexus-cluster"
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
      - "xpack.security.enabled=false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexus-network

  localstack:
    image: localstack/localstack:3.8.0
    container_name: localstack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - EXTRA_CORS_ALLOWED_ORIGINS=https://app.localstack.cloud,http://localhost:5173,http://localhost:5174
    volumes:
      - ./resource_setup/s3-init:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack
    networks:
      - nexus-network

  # ─── Observability Stack ───────────────────────────────

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - nexus-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
      - nexus-app-logs:/var/log/nexus-app
    depends_on:
      - prometheus
    networks:
      - nexus-network

# ─── Named Volumes ───────────────────────────────────

volumes:
  nexus_postgres_data:
  localstack-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  nexus-app-logs:

# ─── Network ─────────────────────────────────────────

networks:
  nexus-network:
    driver: bridge
