spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nexuscore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: redis
      database: 0
      port: 6379
      timeout: 300ms

minio:
  endpoint: http://minio:9000
  bucketName: nexuscore
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    root: info
    com.nexusengine.core: info
