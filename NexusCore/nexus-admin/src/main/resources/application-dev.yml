spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/nexuscore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: NexusCoreHikariCP
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    mongodb:
      uri: mongodb://nexusMongo:Welcome%40123@localhost:27017/nexuscore?authSource=admin
    redis:
      host: localhost
      database: 0
      port: 6379
      timeout: 300ms
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /nexuscore
    username: guest
    password: guest
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-key-here}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

minio:
  endpoint: http://localhost:9000
  bucketName: nexuscore
  accessKey: minioadmin
  secretKey: minioadmin

logging:
  level:
    root: info
    com.nexusengine.core: debug

logstash:
  host: localhost
  enableInnerLog: false