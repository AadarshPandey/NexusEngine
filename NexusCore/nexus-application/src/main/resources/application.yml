jwt:
  expiration: 86400
  secret: ${JWT_SECRET:local-development-jwt-secret-key-needs-32-bytes}
  tokenHead: 'Bearer '
  tokenHeader: Authorization
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    enabled: false
    sampling:
      probability: 1.0
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue
redis:
  database: nexuscore
  expire:
    authCode: 90
    common: 86400
  key:
    admin: ums:admin
    authCode: ums:authCode
    member: ums:member
    orderId: oms:orderId
    resourceList: ums:resourceList
resilience4j:
  circuitbreaker:
    instances:
      default:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
        slidingWindowSize: 10
        waitDurationInOpenState: 10000
      openai:
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
      razorpay:
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        slidingWindowSize: 5
        waitDurationInOpenState: 10s
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  retry:
    instances:
      openai:
        maxAttempts: 3
        waitDuration: 2s
      razorpay:
        maxAttempts: 3
        waitDuration: 2s
secure:
  ignored:
    urls:
    - /swagger-ui.html
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
    - /*/*.html
    - /*/*.js
    - /*/*.css
    - /*/*.png
    - /favicon.ico
    - /portal/sso/**
    - /portal/home/**
    - /dashboard/**
    - /productAttribute/**
    - /productCategory/**
    - /error
    - /portal/product/**
    - /portal/brand/**
    - /portal/stripe/**
    - /portal/review/product/**
    - /portal/review/*/replies
    - /portal/chat/**
    - /uploads/**
    - /admin/login
    - /admin/info
    - /admin/logout
spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:demo-key}
        chat:
          options:
            model: gemini-2.5-flash
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: ai
  application:
    name: nexus-monolith
  autoconfigure:
    exclude:
    - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:minioadmin}
        secret-key: ${AWS_SECRET_KEY:minioadmin}
      region:
        static: us-east-1
      s3:
        endpoint: http://localhost:9000
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    default-schema: migration
    enabled: true
    out-of-order: true
    schemas: migration,catalog,orders,users,marketing,ai,system,messaging
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  mvc: null
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
  - group: default
    packages-to-scan: com.nexusengine.core.portal.controller,com.nexusengine.core.controller
  swagger-ui:
    doc-expansion: none
    enabled: true
    path: /swagger-ui.html
