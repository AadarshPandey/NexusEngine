jwt:
  expiration: 86400
  secret: ${JWT_SECRET:local-development-jwt-secret-key-needs-32-bytes}
  tokenHead: 'Bearer '
  tokenHeader: Authorization
logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    enabled: false
    sampling:
      probability: 1.0
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue
redis:
  database: nexuscore
  expire:
    authCode: 90
    common: 86400
  key:
    admin: iam:admin
    authCode: customer:authCode
    member: customer:member
    orderId: ordering:orderId
    resourceList: iam:resourceList
resilience4j:
  circuitbreaker:
    instances:
      default:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
        slidingWindowSize: 10
        waitDurationInOpenState: 10000
      gemini:
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
      razorpay:
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        slidingWindowSize: 5
        waitDurationInOpenState: 10s
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  retry:
    instances:
      gemini:
        maxAttempts: 3
        waitDuration: 2s
      razorpay:
        maxAttempts: 3
        waitDuration: 2s
secure:
  ignored:
    urls:
    - /swagger-ui.html
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
    - /*/*.html
    - /*/*.js
    - /*/*.css
    - /*/*.png
    - /favicon.ico
    - /portal/sso/**
    - /portal/home/**
    - /error
    - /portal/product/**
    - /portal/brand/**
    - /portal/review/product/**
    - /portal/review/*/replies
    - /portal/chat/**
    - /uploads/**
    - /admin/login
    - /admin/info
    - /admin/logout
spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:demo-key}
        chat:
          options:
            model: gemini-2.5-flash
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-name: ai
  application:
    name: nexus-monolith
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
    - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
      region:
        static: ${AWS_REGION:us-east-1}
      s3:
        endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
        bucket-name: ${AWS_S3_BUCKET:nexus-media}
  flyway:
    enabled: true
    schemas: catalog,ordering,customer,iam,promotion,engagement,payment,ai,messaging
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

razorpay:
  keyId: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  keySecret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  packages-to-scan: com.nexusengine.core.admin,com.nexusengine.core.portal
  paths-to-match: /**
  swagger-ui:
    doc-expansion: none
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  group-configs:
    - group: default
      display-name: "All Operations"
      packages-to-scan: com.nexusengine.core.admin,com.nexusengine.core.portal
      paths-to-match: /**
    - group: admin
      display-name: "Admin Management API"
      packages-to-scan: com.nexusengine.core.admin
      paths-to-match: /**
      paths-to-exclude: /portal/**
    - group: portal
      display-name: "Customer Portal API"
      packages-to-scan: com.nexusengine.core.portal
      paths-to-match: /portal/**
