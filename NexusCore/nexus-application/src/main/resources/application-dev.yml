server:
  port: 8080

spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
    schemas: catalog,ordering,customer,iam,promotion,engagement,payment,ai,messaging
  datasource:
    url: jdbc:postgresql://localhost:5433/nexuscore?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      timeout: 300ms
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /nexuscore
    username: guest
    password: guest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:dummy}
    password: ${SMTP_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

razorpay:
  keyId: ${RAZORPAY_KEY_ID:dummy}
  keySecret: ${RAZORPAY_KEY_SECRET:dummy}

logging:
  level:
    root: info
    com.nexusengine.core: debug

logstash:
  host: localhost
  enableInnerLog: false
