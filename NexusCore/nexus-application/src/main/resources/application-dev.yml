server:
  port: 8080

spring:
  docker:
    compose:
      enabled: false
  flyway:
    default-schema: migration
    schemas: migration,catalog,orders,users,marketing,ai,system,messaging
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
  datasource:
    url: jdbc:postgresql://localhost:5433/nexuscore?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      timeout: 300ms
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /nexuscore
    username: guest
    password: guest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:dummy}
    password: ${SMTP_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:sk-your-key-here}
        chat:
          options:
            model: gemini-2.5-flash

stripe:
  secretKey: ${STRIPE_SECRET_KEY:sk_test_your_key_here}
  publishableKey: ${STRIPE_PUBLISHABLE_KEY:pk_test_your_key_here}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:whsec_your_secret}
  successUrl: http://localhost:5174/payment/success
  cancelUrl: http://localhost:5174/payment/cancel

razorpay:
  keyId: ${RAZORPAY_KEY_ID:dummy}
  keySecret: ${RAZORPAY_KEY_SECRET:dummy}

logging:
  level:
    root: info
    com.nexusengine.core: debug

logstash:
  host: localhost
  enableInnerLog: false
