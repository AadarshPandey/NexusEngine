server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nexuscore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://elasticsearch:9200
  rabbitmq:
    host: rabbitmq
    port: 5672
    virtual-host: /nexuscore
    username: guest
    password: guest

logging:
  level:
    root: info
    com.nexusengine.core: info