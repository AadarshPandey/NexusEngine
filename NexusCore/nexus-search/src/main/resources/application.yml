server:
  port: 8081

spring:
  application:
    name: nexus-search
  profiles:
    active: dev
  elasticsearch:
    uris: http://elasticsearch:9200
  datasource:
    url: jdbc:postgresql://postgres:5432/nexuscore
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
    enabled: true
logging:
  level:
    root: info
    com.nexusengine.core: info
logstash:
  host: logstash
  enableInnerLog: false
