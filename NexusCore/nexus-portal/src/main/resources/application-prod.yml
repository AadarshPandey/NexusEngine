server:
  port: 8085

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: jdbc:postgresql://postgres:5432/nexuscore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    mongodb:
      host: mongodb
      port: 27017
      database: nexuscore
    redis:
      host: redis
      database: 0
      port: 6379
      timeout: 300ms
  rabbitmq:
    host: rabbitmq
    port: 5672
    virtual-host: /nexuscore
    username: guest
    password: guest

logging:
  level:
    root: info
    com.nexusengine.core: info
