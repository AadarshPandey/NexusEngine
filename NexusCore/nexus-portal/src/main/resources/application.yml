spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  application:
    name: nexus-portal
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      embedding:
        options:
          model: text-embedding-ada-002
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

jwt:
  tokenHeader: Authorization
  secret: ${JWT_SECRET:local-development-jwt-secret-key-needs-32-bytes}
  expiration: 604800
  tokenHead: 'Bearer '

secure:
  ignored:
    urls:
      - /swagger-ui.html
      - /actuator/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /v2/api-docs
      - /v3/api-docs/**
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /sso/**
      - /home/**
      - /error
      - /product/**
      - /brand/**
      - /stripe/**
      - /portal/review/product/**
      - /portal/review/*/replies
      - /uploads/**
      - /chat/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: 'none'
  api-docs:
    path: /v3/api-docs
    enabled: true
  group-configs:
    - group: 'nexus-portal'
      packages-to-scan: com.nexusengine.core.portal.controller

redis:
  database: nexuscore
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90
    common: 86400

rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
      razorpay:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      openai:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  retry:
    instances:
      razorpay:
        maxAttempts: 3
        waitDuration: 2s
      openai:
        maxAttempts: 3
        waitDuration: 2s
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
