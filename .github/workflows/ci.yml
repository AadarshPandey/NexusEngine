name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./NexusCore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting
        run: mvn -B spotless:check

      - name: Verify & Test
        run: mvn -B clean verify

  admin-panel:
    name: Admin Panel (React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./NexusAdminPanel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: NexusAdminPanel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

  storefront-web:
    name: Storefront Web (React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./NexusFrontendWeb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: NexusFrontendWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm test

      - name: Typecheck & Build
        run: npm run build

  terraform:
    name: Terraform IaC (Format & Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Root Configuration
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Dev Environment
        run: |
          cd environments/dev
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        run: |
          cd environments/prod
          terraform init -backend=false
          terraform validate
